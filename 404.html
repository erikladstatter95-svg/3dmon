<!doctype html>
<html lang="es-AR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <script>
    try {
      var savedTheme = localStorage.getItem('3dmon_theme') || 'dark';
      if (savedTheme !== 'light' && savedTheme !== 'dark') savedTheme = 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.querySelector('meta[name="color-scheme"]').content = savedTheme;
    } catch (e) {}
  </script>

  <!-- Filtro de Trafico Interno (?soy_erik=1 / ?soy_3dmon=1 / localhost / localStorage) -->
  <script id="dm-internal-filter">
    (function () {
      try {
        var p = new URLSearchParams(window.location.search);
        var mode = p.get('soy_erik') || p.get('soy_3dmon');
        if (mode === '1') localStorage.setItem('dm_ignore_analytics', '1');
        else if (mode === '0') localStorage.removeItem('dm_ignore_analytics');
        if (
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          localStorage.getItem('dm_ignore_analytics') === '1'
        ) {
          window._dmIgnoreAnalytics = true;
          window['ga-disable-G-E76DZMT0FL'] = true;
        }
      } catch (e) {}
    })();
  </script>

  <title>Página no encontrada (404) | 3DMON</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/logo-solo.png" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E76DZMT0FL"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    if (!window._dmIgnoreAnalytics) {
      gtag('js', new Date());
      gtag('config', 'G-E76DZMT0FL');
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/blog.css" />
</head>

<body>
  <header class="main-header">
    <a href="/" class="header-brand" aria-label="3DMON Inicio">
      <img src="/logo-solo.png" alt="3DMON Logo" class="header-logo" />
    </a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="/">Inicio</a>
      <a href="/blog/">Blog</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Cambiar entre modo claro y oscuro">
        <span class="theme-opt theme-opt-light">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
          <span class="theme-label">Modo Claro</span>
        </span>
        <span class="theme-opt theme-opt-dark">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
          <span class="theme-label">Modo Oscuro</span>
        </span>
      </button>
      <a href="https://wa.me/542644113760" class="nav-cta" target="_blank" rel="noopener noreferrer">Pedí tu Presupuesto</a>
    </nav>
  </header>

  <main class="article-shell" style="text-align:center; padding-top:80px;">
    <span class="axis-badge axis-comercial">Error 404</span>
    <h1 class="article-title" style="margin-top:16px;">Página no encontrada</h1>
    <p style="color:var(--text-dim); max-width:520px; margin:0 auto 28px;">
      La dirección que buscás no existe o fue movida al nuevo sistema de guías y servicios de 3DMON.
    </p>
    <div class="cta-actions">
      <a href="/" class="nav-cta">Volver al Inicio</a>
      <a href="/blog/" class="btn-outline-gold">Ir al Blog 3D</a>
    </div>
  </main>

  <script type="module" src="/src/js/blog.js"></script>
</body>

</html>
